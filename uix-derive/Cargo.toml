[package]
name = "uix-derive"
version = "0.0.7"
edition = "2024"
publish = false
license-file = "../LICENSE"
description = "UIX derive macros: Display for route keys"

[lib]
proc-macro = true

[dependencies]
uix-lang-compiler = { path = "../uix-lang-compiler", version = "0.0.7", default-features = false }
proc-macro2 = "1"
quote = "1"
serde_json = "1"
syn = { version = "3", features = ["full"] }

[features]
default = ["image-codecs", "qrcode", "form-pattern", "rich-text", "charts", "table", "navigation", "feedback", "tree-widgets"]
image-codecs = ["uix-lang-compiler/image-codecs"]
qrcode = ["uix-lang-compiler/qrcode"]
form-pattern = ["uix-lang-compiler/form-pattern"]
rich-text = ["uix-lang-compiler/rich-text"]
charts = ["uix-lang-compiler/charts"]
table = ["uix-lang-compiler/table"]
navigation = ["uix-lang-compiler/navigation"]
feedback = ["uix-lang-compiler/feedback"]
tree-widgets = ["uix-lang-compiler/tree-widgets"]
