name: 桌面目标交叉编译

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  linux-host:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 固定 Rust 工具链与目标
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          rustup target add \
            x86_64-unknown-linux-gnu \
            x86_64-pc-windows-msvc \
            aarch64-apple-darwin \
            x86_64-apple-darwin

      - name: 安装 Windows 交叉链接工具
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends clang lld llvm
          cargo install --locked cargo-xwin --version 0.23.1

      - name: 检查全部桌面目标
        run: bash scripts/cross_compile.sh check all dev

      - name: 链接 Linux x64
        run: bash scripts/cross_compile.sh build linux-x64 dev

      - name: 交叉链接 Windows x64
        run: bash scripts/cross_compile.sh build windows-x64 dev
