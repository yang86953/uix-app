# 声明反馈禁用场景的 compile-fail fixture 包信息。
[package]
# 使用稳定名称，便于 metadata 和报告匹配。
name = "uix-usage-feedback-disabled"
# 与主 crate 保持当前基线版本。
version = "0.0.1"
# 使用仓库当前 Rust edition。
edition = "2021"
# 明确该 fixture 只用于仓库内负向验证。
publish = false

# 声明被测主 crate 依赖。
[dependencies]
# 关闭默认 feature，确保反馈 capability 未启用。
uix = { path = "../../../", default-features = false }
