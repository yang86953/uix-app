# 声明 D3D11 禁用公开面 fixture 的包信息。
[package]
# 使用稳定名称，便于 compile-fail 报告匹配。
name = "uix-usage-d3d11-disabled"
# 与主 crate 保持当前基线版本。
version = "0.0.1"
# 使用仓库当前 Rust edition。
edition = "2021"
# 明确该 fixture 只用于仓库内验证。
publish = false

# 声明被测主 crate 依赖。
[dependencies]
# 关闭默认集合且不启用 D3D11，验证公开变体同步消失。
uix = { path = "../../../", default-features = false }
