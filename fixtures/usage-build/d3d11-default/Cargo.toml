# 声明默认图形使用方 fixture 的包信息。
[package]
# 使用稳定名称，便于 metadata 和报告匹配。
name = "uix-usage-d3d11-default"
# 与主 crate 保持当前基线版本。
version = "0.0.1"
# 使用仓库当前 Rust edition。
edition = "2021"
# 明确该 fixture 只用于仓库内验证。
publish = false

# 声明被测主 crate 依赖。
[dependencies]
# 保持主 crate 当前默认 feature，覆盖默认 D3D11 入口。
uix = { path = "../../../" }
