id = "uix-lang"
name = "UIX Lang"
version = "0.0.1"
schema_version = 1
authors = ["yang86"]
description = "UIX Lang support for Zed (syntax highlighting + language server: uix-lang-ls)"

languages = ["languages/uix"]

[lib]
kind = "Rust"
version = "0.7.0"

[language_servers.uix-lang-ls]
language = "UIX Lang"
languages = []

# grammar 源码在本仓库 editors/zed/grammars/uix 子目录；Zed 克隆后本地编译。
[grammars.uix]
repository = "https://github.com/yang86953/uix-app.git"
rev = "main"
path = "editors/zed/grammars/uix"
