[package]
name = "uix-lang-cli"
version = "0.0.5"
edition = "2024"
publish = false
license-file = "../LICENSE"
description = "UIX Lang command-line toolchain adapter"

[dependencies]
proc-macro2 = "1"
quote = "1"
serde_json = "1"
syn = { version = "3", features = ["full"] }
uix-lang-compiler = { path = "../uix-lang-compiler", version = "0.0.5" }
# lsp 子命令委托独立语言服务器 crate，两个入口共享同一实现。
uix-lang-lsp = { path = "../uix-lang-lsp", version = "0.0.5" }
