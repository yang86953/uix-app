[workspace]
# 过程宏 crate 作为工作区成员，与库共享同一锁文件与解析图。
members = ["uix-derive", "uix-lang-compiler", "uix-lang-cli", "uix-lang-lsp", "uix-lang-runtime"]

[package]
name = "uix"
version = "0.0.8"
edition = "2024"
publish = ["gitea"]
license-file = "LICENSE"
# 内部 crate 使用与产品定位一致且不泄露私有仓库位置的稳定描述。
description = "UIX cross-platform native app framework for authorized internal use"
# 有意省略 documentation/homepage/repository 可选字段（Cargo 警告为受控事实）：
# 仓库位于内网 SSH 地址，写入 .crate 会泄露内网信息；当前尚未指定获授权的公开主页。
# 当前按内部候选交付契约接受该受控警告；完成度与任务判定见仓库内各文档事实所有者。

[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.test]
debug = "line-tables-only"
incremental = false

[profile.release]
opt-level = "s"
strip = "symbols"
lto = "fat"
codegen-units = 1
# 过程宏（uix-derive、windows_implement 等）与构建脚本不受 LTO 收益，
# 单独提速：保持多 codegen 单元并行，避免被 fat LTO 拖慢全量构建。
[profile.release.build-override]
opt-level = 3
codegen-units = 16

[dependencies]
uix-lang-runtime = { path = "uix-lang-runtime", version = "0.0.8", registry = "gitea", optional = true }
uix-lang-compiler = { path = "uix-lang-compiler", version = "0.0.8", registry = "gitea", default-features = false, optional = true }
uix-derive = { path = "uix-derive", version = "0.0.8", registry = "gitea", default-features = false }
ab_glyph = "0.2.32"
# 小端 RHI 图片上传以安全切片转换借用既有 u32 像素，不扩大 unsafe 边界。
bytemuck = "1.25.2"
# 使用纯 Rust OpenType shaping，保留源文本 cluster 与复杂脚本定位。
rustybuzz = "0.20.1"
# 使用完整 UAX #9 算法解析段落方向、嵌入级别与视觉顺序。
unicode-bidi = "0.3.18"
# 使用扩展字素簇边界，确保字体回退不拆开组合文本。
unicode-segmentation = "1.13.3"
# 使用 Unicode 15 默认 UAX #14 算法生成强制与允许断行机会。
unicode-linebreak = "0.1.5"
# 真实终端 VT 状态机解析（Apache-2.0 OR MIT），仅随 terminal capability 进入解析图。
vte = { version = "0.15.0", optional = true }
# 终端屏幕字符列宽（MIT OR Apache-2.0），仅随 terminal capability 进入解析图。
unicode-width = { version = "0.1.14", optional = true }
memmap2 = "0.9"
earcut = "0.4.11"
glow = { version = "0.18.0", optional = true }
# 图片文件编解码依赖仅随对应 capability 进入使用方解析图。
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"], optional = true }
# Agent 截屏的 PNG 编码依赖仅随 agent-control 进入使用方解析图。
png = { version = "0.18", default-features = false, optional = true }
# 二维码编码依赖仅随对应组件 capability 进入使用方解析图。
qrcode = { version = "0.14.1", default-features = false, optional = true }
# 表单正则 pattern 规则仅随对应 capability 进入使用方解析图。
regex = { version = "1", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
# 软件动态扩展引擎的数值塔（MIT OR Apache-2.0），仅随 extensions capability
# 进入解析图；不引入 thiserror 或 GC 库。
num-bigint = { version = "0.4", optional = true }
num-rational = { version = "0.4", optional = true }
num-integer = { version = "0.1", optional = true }
num-traits = { version = "0.2", optional = true }
tracing = "0.1"
# Shared by Linux Wayland and Windows Win32 Vulkan adapters (feature = "vulkan").
ash = { version = "0.38", default-features = false, features = ["loaded", "std"], optional = true }

# Windows TSF 的 `#[implement]` 宏只在 Windows target 需要根依赖。
[target.'cfg(windows)'.dependencies]
# 宏生成代码从 crate 根解析精确的 `windows_core` package。
windows-core = "0.62.2"

# Windows 原生后端按需启用 Win32 API 集合。
[target.'cfg(windows)'.dependencies.windows]
version = "0.62.2"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_TextServices",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Data_Xml_Dom",
    "UI_Notifications",
    "Win32_Storage_FileSystem",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
]

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[target.'cfg(target_os = "linux")'.dependencies]
# Linux backend uses the current 0.31 callback-dispatch API.
wayland-client = { version = "0.31.15", features = ["dlopen", "system"] }
wayland-protocols = { version = "=0.32.13", features = ["client", "unstable", "staging"] }
wayland-protocols-plasma = { version = "0.3.12", features = ["client"] }
# UIX OS 桌面组件使用 wlr layer-shell；普通应用窗口仍走 xdg_toplevel。
wayland-protocols-wlr = { version = "=0.3.12", features = ["client"] }
khronos-egl = { version = "6", features = ["static", "no-pkg-config"], optional = true }

# 原生 Metal Adapter 只在 macOS 目标和显式 metal feature 下进入解析图。
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.4", default-features = false, features = ["std"], optional = true }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSError", "NSObject", "NSString", "std"], optional = true }
objc2-metal = { version = "0.3.2", default-features = false, features = [
    "std",
    "MTLAllocation",
    "MTLArgument",
    "MTLBlitCommandEncoder",
    "MTLBuffer",
    "MTLCommandBuffer",
    "MTLCommandEncoder",
    "MTLCommandQueue",
    "MTLDefines",
    "MTLDevice",
    "MTLDrawable",
    "MTLLibrary",
    "MTLPipeline",
    "MTLPixelFormat",
    "MTLRenderCommandEncoder",
    "MTLRenderPass",
    "MTLRenderPipeline",
    "MTLResource",
    "MTLSampler",
    "MTLTexture",
    "MTLTypes",
    "MTLVertexDescriptor",
], optional = true }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = [
    "std",
    "CALayer",
    "CAMetalLayer",
    "objc2-core-foundation",
    "objc2-metal",
], optional = true }

[dev-dependencies]
# 仅由外部消费者测试编译宿主日志配置，不进入 UIX 运行依赖。
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# 门禁快照测试直接消费 Compiler System 的公开 check 入口；与生产为同一工作区实现。
uix-lang-compiler = { path = "uix-lang-compiler" }

[features]
# 可移植模块的 AOT 执行与运行期源码装载分别按需启用。
uix-modules = ["dep:uix-lang-runtime"]
uix-dynamic = ["uix-modules", "dep:uix-lang-compiler"]
# 默认启用首发平台图形矩阵与九项使用方能力：
#   Windows/Linux 优先 Vulkan；Windows 保留 D3D11、Linux 保留 OpenGL ES 兼容回退。
default = ["vulkan", "d3d11", "opengles", "image-codecs", "qrcode", "form-pattern", "rich-text", "charts", "table", "navigation", "feedback", "tree-widgets", "terminal"]
d3d11 = [
    "windows/Win32_Graphics_Direct3D",
    "windows/Win32_Graphics_Direct3D_Fxc",
    "windows/Win32_Graphics_Direct3D11",
    "windows/Win32_Graphics_Dxgi",
    "windows/Win32_Graphics_Dxgi_Common",
]
d3d12 = [
    "windows/Win32_Graphics_Direct3D",
    "windows/Win32_Graphics_Direct3D_Fxc",
    "windows/Win32_Graphics_Direct3D12",
    "windows/Win32_Graphics_Dxgi",
    "windows/Win32_Graphics_Dxgi_Common",
    "windows/Win32_Security",
]
opengles = ["dep:glow", "dep:khronos-egl"]
vulkan = ["dep:ash"]
# 仅为真实 GPU 离屏像素一致性测试开放 crate 内 Vulkan harness。
vulkan-parity-test = ["vulkan", "graphics-parity-test"]
# 仅为 Linux 真实 EGL/GLES parity 开放 crate 内 OpenGL harness 与故障注入。
opengl-parity-test = ["opengles", "test-harness", "graphics-parity-test"]
# 仅为 Windows 真实 D3D11 离屏像素一致性测试开放 crate 内生产 Adapter harness。
d3d11-parity-test = ["d3d11", "test-harness", "graphics-parity-test"]
# 三套原生 parity harness 共享的 Drawing 规范开关，不选择任何具体 API。
graphics-parity-test = []
metal = [
    "dep:objc2",
    "dep:objc2-foundation",
    "dep:objc2-metal",
    "dep:objc2-quartz-core",
]
settings-serde = ["dep:serde", "dep:serde_json"]
# 图片路径与字节解码入口独占 image 依赖，核心 RGBA 位图契约不受影响。
image-codecs = ["dep:image", "uix-derive/image-codecs"]
# 二维码组件独占编码依赖，关闭后同时收缩模块与公开门面。
qrcode = ["dep:qrcode", "uix-derive/qrcode"]
# 表单正则 pattern 规则独占 regex 依赖，基础校验能力不受影响。
form-pattern = ["dep:regex", "uix-derive/form-pattern"]
# 富文本组件、解析布局与快照公开面作为一个可独立关闭的源码能力。
# 注意：富文本的图片插入需同时启用 image-codecs，否则对应构建/渲染路径不可用。
rich-text = ["uix-derive/rich-text"]
# 图表组件族、数据模型、patch 与快照公开面作为一个可独立关闭的源码能力。
charts = ["uix-derive/charts"]
# 数据表格组件族、泛型数据模型、动态渲染与快照公开面作为一个可独立关闭的源码能力。
table = ["uix-derive/table"]
# 导航组件族、交互联动、patch 与快照公开面作为一个可独立关闭的源码能力。
navigation = ["uix-derive/navigation"]
# 反馈组件族、全局门面、应用通知浮层与 Modal 树钩子作为一个可独立关闭的源码能力。
feedback = ["uix-derive/feedback"]
# 树展示、树节点模型、树选择器、patch 与快照公开面作为一个可独立关闭的源码能力。
tree-widgets = ["uix-derive/tree-widgets"]
# 终端组件族、行缓冲模型、命令输入、真实 PTY 会话与快照公开面作为一个可独立关闭的源码能力。
terminal = ["uix-derive/terminal", "dep:vte", "dep:unicode-width"]
agent-control = [
    "dep:serde_json",
    "dep:png",
    "windows/Win32_Security",
    "windows/Win32_Security_Authorization",
    "windows/Win32_Security_Cryptography",
    "windows/Win32_System_IO",
    "windows/Win32_System_Pipes",
]
test-harness = []
# 运行时软件动态扩展（Scheme R7RS-small 受限宿主环境）：默认关闭，
# 未启用者不承担解释器、包扫描或额外运行成本。
extensions = ["dep:num-bigint", "dep:num-rational", "dep:num-integer", "dep:num-traits"]

[lib]
path = "src/lib.rs"
test = false

# Agent 文档消费者只在显式控制面 capability 下进入测试图。
[[test]]
# 固定 Cargo 自动发现时使用的测试目标名称。
name = "agent_docs_public_api"
# 指向 Agent 使用文档的外部消费者入口。
path = "tests/agent_docs_public_api.rs"
# 未启用控制面时跳过整个专属消费者目标。
required-features = ["agent-control"]

# 文本处理工作台示例同时需要动态扩展与 Agent 后台操作面能力。
[[example]]
name = "text_workbench"
required-features = ["extensions", "agent-control"]

# 外部扩展面板同样依赖可选的扩展运行器；默认测试图不得编译此示例。
[[example]]
name = "extension_panel"
required-features = ["extensions"]

# 软件动态扩展公开 API 消费者只在显式扩展 capability 下进入测试图。
[[test]]
name = "extensions_public_api"
path = "tests/extensions_public_api.rs"
required-features = ["extensions"]

[[test]]
name = "uix_modules_public_api"
path = "tests/uix_modules_public_api.rs"
required-features = ["uix-dynamic"]

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[workspace.metadata.smc]
schema = 1
spec_version = "2.0"
spec_revision = "64f55bc5634bf5a647a37cfc296a4b75a4799734"
spec_repository = "../smc"
scope = "all-first-party-rust"
adoption_document = "../../workspace/projects/uix-app/docs/SMC架构采用.md"
