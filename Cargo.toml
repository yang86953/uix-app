[workspace]
# 过程宏 crate 作为工作区成员，与库共享同一锁文件与解析图。
members = ["uix-derive", "uix-lang-compiler", "uix-lang-cli"]

[package]
name = "uix"
version = "0.0.1"
edition = "2024"
publish = false
license-file = "LICENSE"
# 内部 crate 使用与产品定位一致且不泄露私有仓库位置的稳定描述。
description = "UIX cross-platform native app framework for authorized internal use"
# 有意省略 documentation/homepage/repository 可选字段（Cargo 警告为受控事实）：
# 仓库位于内网 SSH 地址，写入 .crate 会泄露内网信息；当前尚未指定获授权的公开主页。
# 当前按内部候选交付契约接受该受控警告，后续变更由 Gitea 父 Issue #1 跟踪。

[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.test]
debug = "line-tables-only"
incremental = false

[profile.release]
opt-level = "s"
strip = "symbols"
lto = "fat"
codegen-units = 1
# 过程宏（uix-derive、windows_implement 等）与构建脚本不受 LTO 收益，
# 单独提速：保持多 codegen 单元并行，避免被 fat LTO 拖慢全量构建。
[profile.release.build-override]
opt-level = 3
codegen-units = 16

[dependencies]
uix-derive = { path = "uix-derive", version = "0.0.1", default-features = false }
ab_glyph = "0.2.32"
# 小端 RHI 图片上传以安全切片转换借用既有 u32 像素，不扩大 unsafe 边界。
bytemuck = "1.25.2"
# 使用纯 Rust OpenType shaping，保留源文本 cluster 与复杂脚本定位。
rustybuzz = "0.20.1"
# 使用完整 UAX #9 算法解析段落方向、嵌入级别与视觉顺序。
unicode-bidi = "0.3.18"
# 使用扩展字素簇边界，确保字体回退不拆开组合文本。
unicode-segmentation = "1.13.3"
# 使用 Unicode 15 默认 UAX #14 算法生成强制与允许断行机会。
unicode-linebreak = "0.1.5"
memmap2 = "0.9"
earcut = "0.4.10"
glow = { version = "0.18.0", optional = true }
# 图片文件编解码依赖仅随对应 capability 进入使用方解析图。
image = { version = "0.25.6", default-features = false, features = ["png", "jpeg"], optional = true }
# 二维码编码依赖仅随对应组件 capability 进入使用方解析图。
qrcode = { version = "0.14.1", default-features = false, optional = true }
# 表单正则 pattern 规则仅随对应 capability 进入使用方解析图。
regex = { version = "1", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
tracing = "0.1"
# Shared by Linux Wayland and Windows Win32 Vulkan adapters (feature = "vulkan").
ash = { version = "0.38", default-features = false, features = ["loaded", "std"], optional = true }

# Windows TSF 的 `#[implement]` 宏只在 Windows target 需要根依赖。
[target.'cfg(windows)'.dependencies]
# 宏生成代码从 crate 根解析精确的 `windows_core` package。
windows-core = "0.62.2"

# Windows 原生后端按需启用 Win32 API 集合。
[target.'cfg(windows)'.dependencies.windows]
version = "0.62.2"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_TextServices",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Data_Xml_Dom",
    "UI_Notifications",
    "Win32_Storage_FileSystem",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
]

[target.'cfg(unix)'.dependencies]
libc = "0.2.186"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
# Linux backend uses the current 0.31 callback-dispatch API.
wayland-client = { version = "0.31.15", features = ["dlopen", "system"] }
wayland-protocols = { version = "=0.32.13", features = ["client", "unstable", "staging"] }
wayland-protocols-plasma = { version = "0.3.12", features = ["client"] }
khronos-egl = { version = "6", features = ["static", "no-pkg-config"], optional = true }

[dev-dependencies]
# 仅由外部消费者测试编译宿主日志配置，不进入 UIX 运行依赖。
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
# 默认启用首发平台图形矩阵与九项使用方能力：
#   Windows/Linux 优先 Vulkan；Windows 保留 D3D11、Linux 保留 OpenGL ES 兼容回退。
default = ["vulkan", "d3d11", "opengles", "image-codecs", "qrcode", "form-pattern", "rich-text", "charts", "table", "navigation", "feedback", "tree-widgets"]
d3d11 = [
    "windows/Win32_Graphics_Direct3D",
    "windows/Win32_Graphics_Direct3D_Fxc",
    "windows/Win32_Graphics_Direct3D11",
    "windows/Win32_Graphics_Dxgi",
    "windows/Win32_Graphics_Dxgi_Common",
]
d3d12 = [
    "windows/Win32_Graphics_Direct3D",
    "windows/Win32_Graphics_Direct3D_Fxc",
    "windows/Win32_Graphics_Direct3D12",
    "windows/Win32_Graphics_Dxgi",
    "windows/Win32_Graphics_Dxgi_Common",
    "windows/Win32_Security",
]
opengles = ["dep:glow", "dep:khronos-egl"]
vulkan = ["dep:ash"]
# 仅为真实 GPU 离屏像素一致性测试开放 crate 内 Vulkan harness。
vulkan-parity-test = ["vulkan", "graphics-parity-test"]
# 仅为 Linux 真实 EGL/GLES parity 开放 crate 内 OpenGL harness 与故障注入。
opengl-parity-test = ["opengles", "test-harness", "graphics-parity-test"]
# 仅为 Windows 真实 D3D11 离屏像素一致性测试开放 crate 内生产 Adapter harness。
d3d11-parity-test = ["d3d11", "test-harness", "graphics-parity-test"]
# 三套原生 parity harness 共享的 Drawing 规范开关，不选择任何具体 API。
graphics-parity-test = []
metal = []
settings-serde = ["dep:serde", "dep:serde_json"]
# 图片路径与字节解码入口独占 image 依赖，核心 RGBA 位图契约不受影响。
image-codecs = ["dep:image", "uix-derive/image-codecs"]
# 二维码组件独占编码依赖，关闭后同时收缩模块与公开门面。
qrcode = ["dep:qrcode", "uix-derive/qrcode"]
# 表单正则 pattern 规则独占 regex 依赖，基础校验能力不受影响。
form-pattern = ["dep:regex", "uix-derive/form-pattern"]
# 富文本组件、解析布局与快照公开面作为一个可独立关闭的源码能力。
# 注意：富文本的图片插入需同时启用 image-codecs，否则对应构建/渲染路径不可用。
rich-text = ["uix-derive/rich-text"]
# 图表组件族、数据模型、patch 与快照公开面作为一个可独立关闭的源码能力。
charts = ["uix-derive/charts"]
# 数据表格组件族、泛型数据模型、动态渲染与快照公开面作为一个可独立关闭的源码能力。
table = ["uix-derive/table"]
# 导航组件族、交互联动、patch 与快照公开面作为一个可独立关闭的源码能力。
navigation = ["uix-derive/navigation"]
# 反馈组件族、全局门面、应用通知浮层与 Modal 树钩子作为一个可独立关闭的源码能力。
feedback = ["uix-derive/feedback"]
# 树展示、树节点模型、树选择器、patch 与快照公开面作为一个可独立关闭的源码能力。
tree-widgets = ["uix-derive/tree-widgets"]
agent-control = [
    "dep:serde_json",
    "windows/Win32_Security",
    "windows/Win32_Security_Authorization",
    "windows/Win32_Security_Cryptography",
    "windows/Win32_System_IO",
    "windows/Win32_System_Pipes",
]
test-harness = []

[lib]
path = "src/lib.rs"
test = false

# Agent 文档消费者只在显式控制面 capability 下进入测试图。
[[test]]
# 固定 Cargo 自动发现时使用的测试目标名称。
name = "agent_docs_public_api"
# 指向 Agent 使用文档的外部消费者入口。
path = "tests/agent_docs_public_api.rs"
# 未启用控制面时跳过整个专属消费者目标。
required-features = ["agent-control"]

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
