[workspace]
resolver = "2"
members = [
    "core",
    "diag",
    "uix-macros",
    "app",
    "demo",
    "graphics",
    "platform",
    "services",
    "ui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
log = "0.4.33"
chrono = "0.4.45"
glow = "0.17.0"
khronos-egl = { version = "6", features = ["static"] }
bitflags = "2.13.0"
rand = "0.10.1"
serde_json = "1.0.150"
ab_glyph = "0.2.32"
unicode-linebreak = "0.1.5"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[package]
name = "uix"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
uix-core = { path = "core" }
uix-diag = { path = "diag" }
uix-macros = { path = "uix-macros" }
uix-app = { path = "app" }
uix-graphics = { path = "graphics" }
uix-platform = { path = "platform" }
uix-services = { path = "services" }
uix-ui = { path = "ui" }
chrono = { workspace = true }
bitflags = { workspace = true }
rand = { workspace = true }
log = { workspace = true }
serde_json = { workspace = true }
ab_glyph = { workspace = true }
unicode-linebreak = { workspace = true }

[target.'cfg(windows)'.dependencies.windows]
version = "0.62.2"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_UI_Shell",
    "Win32_Storage_FileSystem",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input_KeyboardAndMouse",
]

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
libc = "0.2.186"
wayland-client = { version = "=0.31.14", features = ["dlopen"] }
wayland-protocols = { version = "=0.32.13", features = ["client", "unstable", "staging"] }

[lib]
path = "src/lib.rs"

[lints]
workspace = true
