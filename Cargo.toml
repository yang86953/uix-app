[package]
name = "uix"
version = "0.0.1"
edition = "2021"
publish = false
license-file = "LICENSE"
exclude = ["test-reports/**"]

[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.test]
debug = "line-tables-only"
incremental = false

[profile.release]
opt-level = "s"
strip = "symbols"
lto = "fat"
codegen-units = 1

[dependencies]
uix-derive = { path = "uix-derive", version = "0.0.1" }
ab_glyph = "0.2.32"
memmap2 = "0.9"
earcut = "0.4.10"
glow = { version = "0.18.0", optional = true }
image = { version = "0.25.6", default-features = false, features = ["png", "jpeg"] }
# 二维码编码依赖仅随对应组件 capability 进入使用方解析图。
qrcode = { version = "0.14.1", default-features = false, optional = true }
# 表单正则 pattern 规则仅随对应 capability 进入使用方解析图。
regex = { version = "1", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# `#[implement]` 宏在 crate 根解析 `windows_core`；无平台 cfg，避免违反 native-only cfg 边界。
windows-core = "0.62.2"
# Shared by Linux Wayland and Windows Win32 Vulkan adapters (feature = "vulkan").
ash = { version = "0.38", default-features = false, features = ["loaded", "std"], optional = true }
bytemuck = { version = "1.25", features = ["derive"] }
raw-window-handle = "0.6.2"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62.2"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_TextServices",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_UI_Shell",
    "Win32_Storage_FileSystem",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
]

[target.'cfg(unix)'.dependencies]
libc = "0.2.186"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
# Linux backend uses the current 0.31 callback-dispatch API.
wayland-client = { version = "=0.31.14", features = ["dlopen", "system"] }
wayland-protocols = { version = "=0.32.13", features = ["client", "unstable", "staging"] }
khronos-egl = { version = "6", features = ["static", "no-pkg-config"], optional = true }

[features]
# 保持既有默认 API：生产 D3D11、二维码与表单 pattern 规则默认启用。
default = ["d3d11", "qrcode", "form-pattern"]
d3d11 = [
    "windows/Win32_Graphics_Direct3D",
    "windows/Win32_Graphics_Direct3D_Fxc",
    "windows/Win32_Graphics_Direct3D11",
    "windows/Win32_Graphics_Dxgi",
    "windows/Win32_Graphics_Dxgi_Common",
]
d3d12 = [
    "windows/Win32_Graphics_Direct3D",
    "windows/Win32_Graphics_Direct3D_Fxc",
    "windows/Win32_Graphics_Direct3D12",
    "windows/Win32_Graphics_Dxgi",
    "windows/Win32_Graphics_Dxgi_Common",
    "windows/Win32_Security",
]
opengles = ["dep:glow", "dep:khronos-egl"]
vulkan = ["dep:ash"]
metal = []
settings-serde = ["dep:serde", "dep:serde_json"]
# 二维码组件独占编码依赖，关闭后同时收缩模块与公开门面。
qrcode = ["dep:qrcode"]
# 表单正则 pattern 规则独占 regex 依赖，基础校验能力不受影响。
form-pattern = ["dep:regex"]
agent-control = [
    "dep:serde_json",
    "windows/Win32_Security",
    "windows/Win32_Security_Authorization",
    "windows/Win32_Security_Cryptography",
    "windows/Win32_System_IO",
    "windows/Win32_System_Pipes",
]
test-harness = []

[lib]
path = "src/lib.rs"
test = false

[[bin]]
name = "uix-demo"
path = "demo/src/main.rs"
test = false

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
