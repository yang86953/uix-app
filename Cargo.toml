[workspace]
resolver = "2"
members = [
    "app",
    "demo",
    "graphics",
    "platform",
    "ui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
glow = "0.17.0"
khronos-egl = { version = "6", features = ["static"] }
ab_glyph = "0.2.32"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[package]
name = "uix"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
uix-app = { path = "app" }
uix-graphics = { path = "graphics" }
uix-platform = { path = "platform" }
uix-ui = { path = "ui" }

[lib]
path = "src/lib.rs"

[lints]
workspace = true
