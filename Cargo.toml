[workspace]
# 语言与工具同属此包；组件库是独立仓库中的第二个包。
members = []
resolver = "3"

[package]
name = "uix-app"
autobins = false
version = "0.0.8"
edition = "2024"
license = "MIT"
description = "UIX cross-platform native app framework"
repository = "https://github.com/yang86953/uix-app"
# crates.io 只放纯净源码：禁用 README 自动发现（官方 readme=false 机制），
# 产品文档仅随源码仓库分发。
readme = false
publish = ["crates-io"]
# include 白名单限定源码、能力声明与许可文件；根路径以 / 锚定避免同名
# 文件跨目录匹配。src 内独立 cfg(test) 测试文件移至 tests-src/、GPU parity 测试
# 支撑留在 tests/support/（经仓库专用 cfg 入口启用），均不入包；
# 字体使用说明与全部产品文档不进包，第三方许可通知随包以满足署名义务。
include = [
    "src/**",
    "!src/lang/tests-src/**",
    "/uix-library.json",
    "/LICENSE",
    "/THIRD_PARTY_NOTICES.md",
]

[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.test]
debug = "line-tables-only"
incremental = false

[profile.release]
opt-level = "s"
strip = "symbols"
lto = "fat"
codegen-units = 1
# 第三方过程宏与构建脚本不受目标 LTO 收益，
# 单独提速：保持多 codegen 单元并行，避免被 fat LTO 拖慢全量构建。
[profile.release.build-override]
opt-level = 3
codegen-units = 16

[dependencies]
toml = { version = "0.9.12", optional = true }
sha2 = { version = "0.10.9", optional = true }
proc-macro2 = { version = "1", optional = true }
quote = { version = "1", optional = true }
regex = { version = "1", optional = true }
syn = { version = "3", features = ["full", "visit", "visit-mut"], optional = true }
ab_glyph = { version = "0.2.32", optional = true }
# 小端 RHI 图片上传以安全切片转换借用既有 u32 像素，不扩大 unsafe 边界。
bytemuck = { version = "1.25.2", optional = true }
# 使用纯 Rust OpenType shaping，保留源文本 cluster 与复杂脚本定位。
rustybuzz = { version = "0.20.1", optional = true }
# 使用完整 UAX #9 算法解析段落方向、嵌入级别与视觉顺序。
unicode-bidi = { version = "0.3.18", optional = true }
# 使用扩展字素簇边界，确保字体回退不拆开组合文本。
unicode-segmentation = { version = "1.13.3", optional = true }
# 使用 Unicode 15 默认 UAX #14 算法生成强制与允许断行机会。
unicode-linebreak = { version = "0.1.5", optional = true }


memmap2 = { version = "0.9", optional = true }
earcut = { version = "0.4.11", optional = true }
glow = { version = "0.18.0", optional = true }
# 图片文件编解码依赖仅随对应 capability 进入使用方解析图。
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"], optional = true }
# Agent 截屏的 PNG 编码依赖仅随 agent-control 进入使用方解析图。
png = { version = "0.18", default-features = false, optional = true }


serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
# 软件动态扩展引擎的数值塔（MIT OR Apache-2.0），仅随 extensions capability
# 进入解析图；不引入 thiserror 或 GC 库。
num-bigint = { version = "0.4", optional = true }
num-rational = { version = "0.4", optional = true }
num-integer = { version = "0.1", optional = true }
num-traits = { version = "0.2", optional = true }
tracing = { version = "0.1", optional = true }
# Shared by Linux Wayland and Windows Win32 Vulkan adapters (feature = "vulkan").
ash = { version = "0.38", default-features = false, features = ["loaded", "std"], optional = true }

# Windows TSF 的 `#[implement]` 宏只在 Windows target 需要根依赖。
[target.'cfg(windows)'.dependencies]
# 宏生成代码从 crate 根解析精确的 `windows_core` package。
windows-core = { version = "0.62.2", optional = true }

# Windows 原生后端按需启用 Win32 API 集合。
[target.'cfg(windows)'.dependencies.windows]
optional = true
version = "0.62.2"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_TextServices",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Data_Xml_Dom",
    "UI_Notifications",
    "Win32_Storage_FileSystem",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
]

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2.189", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
# Linux backend uses the current 0.31 callback-dispatch API.
wayland-client = { version = "0.31.15", features = ["dlopen", "system"] , optional = true }
wayland-protocols = { version = "=0.32.13", features = ["client", "unstable", "staging"] , optional = true }
wayland-protocols-plasma = { version = "0.3.12", features = ["client"] , optional = true }
# UIX OS 桌面组件使用 wlr layer-shell；普通应用窗口仍走 xdg_toplevel。
wayland-protocols-wlr = { version = "=0.3.12", features = ["client"] , optional = true }
khronos-egl = { version = "6", features = ["static", "no-pkg-config"], optional = true }

# 原生 Metal Adapter 只在 macOS 目标和显式 metal feature 下进入解析图。
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.4", default-features = false, features = ["std"], optional = true }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSError", "NSObject", "NSString", "std"], optional = true }
objc2-metal = { version = "0.3.2", default-features = false, features = [
    "std",
    "MTLAllocation",
    "MTLArgument",
    "MTLBlitCommandEncoder",
    "MTLBuffer",
    "MTLCommandBuffer",
    "MTLCommandEncoder",
    "MTLCommandQueue",
    "MTLDefines",
    "MTLDevice",
    "MTLDrawable",
    "MTLLibrary",
    "MTLPipeline",
    "MTLPixelFormat",
    "MTLRenderCommandEncoder",
    "MTLRenderPass",
    "MTLRenderPipeline",
    "MTLResource",
    "MTLSampler",
    "MTLTexture",
    "MTLTypes",
    "MTLVertexDescriptor",
], optional = true }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = [
    "std",
    "CALayer",
    "CAMetalLayer",
    "objc2-core-foundation",
    "objc2-metal",
], optional = true }

[dev-dependencies]
# 仅由外部消费者测试编译宿主日志配置，不进入 UIX 运行依赖。
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# 门禁快照测试直接消费 Compiler System 的公开 check 入口；与生产为同一工作区实现。

[target.'cfg(target_arch = "wasm32")'.dependencies]
zed_extension_api = { version = "0.7", optional = true }

[features]
zed-extension = ["dep:zed_extension_api"]
core = []
reactive = ["core"]
layout = ["core"]
diagnostics = ["core", "dep:tracing"]
data = ["core", "dep:tracing"]
platform-contracts = ["core"]
graphics = ["core", "diagnostics", "platform-contracts", "dep:ab_glyph", "dep:rustybuzz", "dep:unicode-bidi", "dep:unicode-segmentation", "dep:unicode-linebreak", "dep:memmap2", "dep:earcut"]
graphics-gpu = ["graphics", "dep:bytemuck"]
ui = ["reactive", "layout", "graphics", "platform-contracts"]
platform = ["platform-contracts", "diagnostics", "dep:windows-core", "dep:windows", "dep:libc", "dep:wayland-client", "dep:wayland-protocols", "dep:wayland-protocols-plasma", "dep:wayland-protocols-wlr"]
application = ["ui", "platform", "data"]
lang-build = ["dep:regex", "dep:serde", "dep:serde_json", "dep:proc-macro2", "dep:quote", "dep:syn"]
lang-tools = ["lang-build", "dep:serde", "dep:serde_json", "dep:toml", "dep:sha2"]
hot-reload = ["application", "lang-build"]
# 可移植模块的 AOT 执行与运行期源码装载分别按需启用。
uix-modules = []
uix-components = []
uix-dynamic = ["uix-modules", "uix-components", "lang-build"]
# 默认提供完整原生应用及首发平台图形后端：
#   Windows/Linux 优先 Vulkan；Windows 保留 D3D11、Linux 保留 OpenGL ES 兼容回退。
default = ["application", "vulkan", "d3d11", "opengles", "image-codecs"]
d3d11 = ["platform", "graphics-gpu",
    "windows/Win32_Graphics_Direct3D",
    "windows/Win32_Graphics_Direct3D_Fxc",
    "windows/Win32_Graphics_Direct3D11",
    "windows/Win32_Graphics_Dxgi",
    "windows/Win32_Graphics_Dxgi_Common",
]
d3d12 = ["platform", "graphics-gpu",
    "windows/Win32_Graphics_Direct3D",
    "windows/Win32_Graphics_Direct3D_Fxc",
    "windows/Win32_Graphics_Direct3D12",
    "windows/Win32_Graphics_Dxgi",
    "windows/Win32_Graphics_Dxgi_Common",
    "windows/Win32_Security",
]
opengles = ["platform", "graphics-gpu", "dep:glow", "dep:khronos-egl"]
vulkan = ["platform", "graphics-gpu", "dep:ash"]
# GPU 离屏像素一致性验证不占用公开 feature：实现留在仓库 tests/support/，经仓库
# 专用 cfg 键（uix_gpu_parity_vulkan/opengl/d3d11）启用，见 scripts/run_gpu_parity.sh。
metal = ["platform", "graphics-gpu",
    "dep:objc2",
    "dep:objc2-foundation",
    "dep:objc2-metal",
    "dep:objc2-quartz-core",
]
settings-serde = ["data", "dep:serde", "dep:serde_json"]
# 图片路径与字节解码入口独占 image 依赖，核心 RGBA 位图契约不受影响。
image-codecs = ["graphics", "dep:image"]
agent-control = [
    "application",
    "dep:serde_json",
    "dep:png",
    "windows/Win32_Security",
    "windows/Win32_Security_Authorization",
    "windows/Win32_Security_Cryptography",
    "windows/Win32_System_IO",
    "windows/Win32_System_Pipes",
]
test-harness = ["ui"]
# 运行时软件动态扩展（Scheme R7RS-small 受限宿主环境）：默认关闭，
# 未启用者不承担解释器、包扫描或额外运行成本。
extensions = ["core", "dep:num-bigint", "dep:num-rational", "dep:num-integer", "dep:num-traits"]

[lib]
# 包名 uix-app 对应的 Rust 库名固定为 uix_app，消费者按 `uix_app::` 路径引用。
name = "uix_app"
path = "src/lib.rs"
test = false

# Agent 文档消费者只在显式控制面 capability 下进入测试图。
[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = [
    'cfg(uix_gpu_parity_vulkan)',
    'cfg(uix_gpu_parity_opengl)',
    'cfg(uix_gpu_parity_d3d11)',
    'cfg(uix_repo_doc_contract)',
]

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[workspace.metadata.smc]
schema = 1
spec_version = "2.0"
spec_revision = "84a99b0166f68b60ca9bf996199748d300acacb2"
spec_repository = "../smc"
scope = "all-first-party-rust"
adoption_document = "docs/架构/SMC采用.md"

[[bin]]
name = "uix"
path = "src/bin/uix.rs"
required-features = ["lang-tools"]

[[bin]]
name = "uix-lang-ls"
path = "src/bin/uix-lang-ls.rs"
required-features = ["lang-tools"]

[[example]]
name = "zed_extension"
path = "examples/zed_extension.rs"
crate-type = ["cdylib"]
required-features = ["zed-extension"]

[[example]]
name = "reactive"
path = "examples/reactive.rs"
required-features = ["reactive"]

[[example]]
name = "layout"
path = "examples/layout.rs"
required-features = ["layout"]

[[example]]
name = "offscreen"
path = "examples/offscreen.rs"
required-features = ["graphics"]

[[example]]
name = "headless_ui"
path = "examples/headless_ui.rs"
required-features = ["test-harness"]
