[package]
name = "uix"
version = "0.1.0"
edition = "2021"
publish = false
license-file = "LICENSE"

[dependencies]
ab_glyph = "0.2.32"
earcut = "0.4.10"
glow = { version = "0.17.0", optional = true }
image = { version = "0.25.6", default-features = false, features = ["png", "jpeg"] }
serde_json = { version = "1", optional = true }
# `#[implement]` 宏在 crate 根解析 `windows_core`；无平台 cfg，避免违反 native-only cfg 边界。
windows-core = "0.62.2"
# Shared by Linux Wayland and Windows Win32 Vulkan adapters (feature = "vulkan").
ash = { version = "0.38", default-features = false, features = ["loaded", "std"], optional = true }

[target.'cfg(windows)'.dependencies.windows]
version = "0.62.2"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_TextServices",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_UI_Shell",
    "Win32_Storage_FileSystem",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input_KeyboardAndMouse",
]

[target.'cfg(unix)'.dependencies]
libc = "0.2.186"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
wayland-client = { version = "=0.29.5", features = ["dlopen"] }
wayland-protocols = { version = "=0.29.5", features = ["client", "unstable_protocols", "staging_protocols"] }
khronos-egl = { version = "6", features = ["static", "no-pkg-config"], optional = true }

[features]
default = ["d3d11", "d3d12", "opengles", "vulkan", "metal"]
d3d11 = [
    "windows/Win32_Graphics_Direct3D",
    "windows/Win32_Graphics_Direct3D_Fxc",
    "windows/Win32_Graphics_Direct3D11",
    "windows/Win32_Graphics_Dxgi",
    "windows/Win32_Graphics_Dxgi_Common",
]
d3d12 = [
    "windows/Win32_Graphics_Direct3D",
    "windows/Win32_Graphics_Direct3D_Fxc",
    "windows/Win32_Graphics_Direct3D12",
    "windows/Win32_Graphics_Dxgi",
    "windows/Win32_Graphics_Dxgi_Common",
    "windows/Win32_Security",
]
opengles = ["dep:glow", "dep:khronos-egl"]
vulkan = ["dep:ash"]
metal = []
agent-control = [
    "dep:serde_json",
    "windows/Win32_Security",
    "windows/Win32_Security_Authorization",
    "windows/Win32_Security_Cryptography",
    "windows/Win32_System_IO",
    "windows/Win32_System_Pipes",
]
test-harness = []

[lib]
path = "src/lib.rs"

[[bin]]
name = "uix-demo"
path = "demo/src/main.rs"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
