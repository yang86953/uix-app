[package]
name = "uix-cli-demo"
version = "0.0.1"
edition = "2021"
publish = false
license-file = "../../LICENSE"
description = "UIX CLI 功能域演示（core / draw / ui / app / data 无 GUI 输出）"

[dependencies]
# CLI 演示使用与 GUI 演示相同的基础能力组合，不启用日志订阅器。
uix = { path = "../..", default-features = false, features = [
    "d3d11",
    "image-codecs",
    "qrcode",
    "form-pattern",
    "rich-text",
    "charts",
    "table",
    "navigation",
    "feedback",
    "tree-widgets",
] }

[[bin]]
name = "uix-cli-demo"
path = "src/main.rs"
test = false
