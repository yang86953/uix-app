# UIX 演示工作区 — 只保留 uix-lang 全组件主演示
#   根目录 `cargo` 命令不包含演示项目，演示构建需显式指向本清单：
#     cargo run --manifest-path demo/Cargo.toml --bin uix-lang-demo

[workspace]
# 主演示以 .uix 文档覆盖全部已登记组件。
members = ["uix-lang-demo"]
resolver = "2"

# ── 编译产物配置 ──────────────────────────────────────────────
# demo 是独立工作区，不继承根 Cargo.toml 的 profile 设置；
# 显式声明后产物配置入仓，不再依赖机器级 ~/.cargo/config.toml 调优。
[profile.dev]
debug = "line-tables-only"
incremental = false

# ── 本机调试专用 profile ──────────────────────────────────────
# 常规 dev 仅保留行号表（line-tables-only），调试器断点可用但看不到变量值；
# debug-full 携带完整调试信息，供本机调试器使用，
# 产物独立输出到 target/debug-full/，不污染常规 dev 产物。
[profile.debug-full]
inherits = "dev"
debug = "full"

[profile.test]
debug = "line-tables-only"
incremental = false

[profile.release]
# 与根包保持一致：体积优先（Demo 为分发载体），符号表全剥离。
opt-level = "s"
strip = "symbols"
lto = "fat"
codegen-units = 1
# 过程宏与构建脚本不受 LTO 收益，单独提速编译。
[profile.release.build-override]
opt-level = 3
codegen-units = 16
