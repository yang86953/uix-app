# 声明 overlay backdrop blur 真窗验收程序。
[package]
# 使用独立二进制名称便于自动化精确启动。
name = "backdrop-visual"
# 与仓库当前演示版本保持一致。
version = "0.0.1"
# 使用仓库统一的 Rust 版本语义。
edition = "2024"
# 验收程序不发布到注册表。
publish = false
# 复用仓库许可证。
license-file = "../../LICENSE"

# 声明真窗运行所需的最小依赖。
[dependencies]
# 同一上层验收程序同时交给 Windows D3D11 与 Linux OpenGL ES Adapter。
uix = { path = "../..", default-features = false, features = ["d3d11", "opengles", "feedback", "agent-control"] }

# 声明真窗程序自己的可选验收能力。
[features]
# 默认只保留手工视觉验收，不携带测试控制面。
default = []
# 自动像素模式显式透传根库 test-harness capability。
test-harness = ["uix/test-harness"]

# 登记唯一验收二进制入口。
[[bin]]
# 与包名保持一致。
name = "backdrop-visual"
# 指向 Rust 组合根入口。
path = "src/main.rs"
# 该二进制只用于运行验收，不生成独立测试壳。
test = false
