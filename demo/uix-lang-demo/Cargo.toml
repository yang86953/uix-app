[package]
name = "uix-lang-demo"
version = "0.0.1"
edition = "2024"
publish = false
license-file = "../../LICENSE"
description = "UIX uix-lang 编译期界面演示"

[dependencies]
# Windows 使用 D3D11；Linux/Wayland 使用 EGL OpenGL ES。
uix = { path = "../..", default-features = false, features = ["d3d11", "opengles"] }

[[bin]]
name = "uix-lang-demo"
path = "src/main.rs"
test = false
