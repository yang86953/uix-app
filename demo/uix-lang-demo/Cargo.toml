[package]
name = "uix-lang-demo"
version = "0.0.2"
edition = "2024"
publish = false
license-file = "../../LICENSE"
description = "UIX uix-lang 编译期界面演示"

[dependencies]
# 与 API GUI Demo 对齐公开组件能力，同时保留声明式入口自己的运行边界。
uix = { path = "../..", default-features = false, features = [
    # Windows/Linux 首选 Vulkan 图形后端。
    "vulkan",
    # Windows 保留 D3D11 兼容回退。
    "d3d11",
    # Linux/Wayland 保留 EGL OpenGL ES 兼容回退。
    "opengles",
    # 启用图片编解码能力。
    "image-codecs",
    # 启用二维码组件能力。
    "qrcode",
    # 启用表单模式能力。
    "form-pattern",
    # 启用富文本组件能力。
    "rich-text",
    # 启用图表运行时能力。
    "charts",
    # 启用表格运行时能力。
    "table",
    # 启用导航组件能力。
    "navigation",
    # 启用反馈组件能力。
    "feedback",
    # 启用树形组件能力。
    "tree-widgets",
    # 结束与 API GUI Demo 对齐的公开组件能力列表。
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

[features]
# 默认启用演示日志订阅，与既有演示行为一致。
default = ["demo-logging"]
# 演示二进制日志订阅独占 tracing-subscriber（库侧不再提供订阅器，日志契约仅保留 tracing）。
demo-logging = ["dep:tracing-subscriber"]
# 显式透传本机 Agent Bridge 能力，运行时仍需 --agent-control 二次启用。
agent-control = ["uix/agent-control"]
# 显式透传图形故障注入能力，运行时仍需 --test-graphics-recovery 二次启用。
test-harness = ["uix/test-harness"]

[[bin]]
name = "uix-lang-demo"
path = "src/main.rs"
# 保留二进制近邻单元测试，验证启动门禁与图形恢复页面状态机。
test = true
