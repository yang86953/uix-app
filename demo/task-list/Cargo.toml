[package]
name = "uix-task-list"
version = "0.1.0"
edition = "2024"
publish = false
license-file = "LICENSE"
description = "内部授权使用的 UIX Lang 与 Rust 任务清单示例"

[workspace]

[dependencies]
# 随公开源码树以 path+version 消费框架；不再依赖已清理远程历史的固定 rev。
uix-app = { path = "../..", version = "0.0.8", default-features = false, features = ["vulkan", "settings-serde"] }
serde = { version = "1", features = ["derive"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
test-harness = ["uix-app/test-harness"]

[profile.dev]
debug = "line-tables-only"
incremental = false
