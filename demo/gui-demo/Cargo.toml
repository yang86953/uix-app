[package]
name = "uix-gui-demo"
version = "0.0.1"
edition = "2021"
publish = false
license-file = "../../LICENSE"
description = "UIX GUI 多页演示（12 页应用 + Agent 与 test-harness 测试支撑）"

[dependencies]
# 演示固定使用 uix 的基础能力组合（与既有演示行为一致），
# 日志订阅、Agent Bridge 与自动测试支撑作为本项目的可开关 feature 透传。
uix = { path = "../..", default-features = false, features = [
    "d3d11",
    "image-codecs",
    "qrcode",
    "form-pattern",
    "rich-text",
    "charts",
    "table",
    "navigation",
    "feedback",
    "tree-widgets",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

[features]
# 默认启用演示日志订阅，与既有 `cargo run --bin uix-demo` 行为一致。
default = ["demo-logging"]
demo-logging = ["dep:tracing-subscriber", "uix/demo-logging"]
agent-control = ["uix/agent-control"]
test-harness = ["uix/test-harness"]

[[bin]]
name = "uix-demo"
path = "src/main.rs"
test = false
