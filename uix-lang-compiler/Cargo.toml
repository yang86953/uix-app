[package]
name = "uix-lang-compiler"
version = "0.0.1"
edition = "2024"
publish = false
license-file = "../LICENSE"
description = "UIX Lang shared build-time compiler system"

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

[features]
default = ["image-codecs", "qrcode", "form-pattern", "rich-text", "charts", "table", "navigation", "feedback", "tree-widgets"]
image-codecs = []
qrcode = []
form-pattern = []
rich-text = []
charts = []
table = []
navigation = []
feedback = []
tree-widgets = []

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
