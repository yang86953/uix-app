[package]
name = "uix-lang-compiler"
version = "0.0.8"
edition = "2024"
publish = ["gitea"]
license-file = "../LICENSE"
description = "UIX Lang shared build-time compiler system"

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "3", features = ["full"] }

[features]
default = ["image-codecs", "qrcode", "form-pattern", "rich-text", "charts", "table", "navigation", "feedback", "tree-widgets"]
# 仅为开发工具提供 overlay 驱动的 AOT 重编译入口，不进入默认构建。
hot-reload = []
image-codecs = []
qrcode = []
form-pattern = []
rich-text = []
charts = []
table = []
navigation = []
feedback = []
tree-widgets = []

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
