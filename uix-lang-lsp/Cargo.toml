[package]
name = "uix-lang-lsp"
version = "0.0.3"
edition = "2024"
publish = false
license-file = "../LICENSE"
description = "UIX Lang language server stdio adapter"

# 语言事实（诊断、schema、格式化、源码图、语义 IR）只来自共享 compiler；
# 本 crate 只依赖协议编码与编译器公开契约，不引入异步运行时或额外重库。
[dependencies]
serde_json = "1"
uix-lang-compiler = { path = "../uix-lang-compiler", version = "0.0.3" }

# 独立语言服务器二进制：编辑器可直接以 `uix-lang-ls --stdio` 启动。
[[bin]]
name = "uix-lang-ls"
path = "src/main.rs"
